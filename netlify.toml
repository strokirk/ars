# The interactive site is a Vite + Preact app in web/. Netlify builds it on deploy.
# It imports the chargen engine (../chargen) and rules data (../data) at build time,
# so the whole repo must be checked out (the default).
[build]
  base = "web"
  # pnpm is the package manager for this repo (web/pnpm-lock.yaml, and the
  # packageManager field in web/package.json pins the version via corepack).
  command = "pnpm install --frozen-lockfile && pnpm run build"
  publish = "web/dist"

# SPA: every path serves the app shell (routing is client-side via the URL hash).
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
